[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fixture"
version = "1.0.0"
description = "Standalone test fixture for validating the browser agent + QA smoke test"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "pydantic[email]>=2.10.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.25",
]

# Build-time MCP tooling the codespace session needs. Every real product declares
# this via the template's pyproject; the fixture owns its own pyproject (it is in
# render-fixture-templates.js NEVER_COPY, correctly — the template's would replace
# the fixture's app package), so the extra has to be carried here by hand.
#
# 🔴 Its absence is why BOTH `dreamteam-suggestions` and `dreamteam-lane-tracking`
# reported `failed` in every fixture build: `ensureServiceDeps` installs
# `.[dev,services,buildtools]`, pip warns "fixture 1.0.0 does not provide the extra
# 'buildtools'", EXITS 0, and the packages are never installed — while `.mcp.json`
# advertises both servers. Same advertised-but-absent shape as reliable-ai before
# the 2026-08-11 fix, arriving by a third route: a missing extra rather than a
# failed install or a missing config.
#
# SHA-pinned, not `@stable`, deliberately: the Dockerfile COPYs pyproject.toml and
# buildkit caches that layer, so a moving branch ref means a new tool silently
# never installs. Production gets the same property by render-injecting the
# resolved SHA; here it is by hand and will need refreshing.
buildtools = [
    "dreamteam-suggestions-mcp @ git+https://github.com/dreamteam-ai-labs/dreamteam-suggestions-mcp.git@ac01fa496765c71237984a15c3a8c3378a8e06e9",
    "dreamteam-lane-tracking-mcp @ git+https://github.com/dreamteam-ai-labs/dreamteam-lane-tracking-mcp.git@49fda30866b00acc33a24c610745ba03e433d21b",
]

# Same story as buildtools: every real product declares this via the template
# (pyproject.toml.mustache `services`, pinned @{{service_auth_rev}}); the fixture
# carries it by hand. Its absence made `ensureServiceDeps` warn "does not provide
# the extra 'services'" in every run and left dreamteam_service_auth
# non-importable while QA templates import it. SHA = stable branch 2026-08-12;
# refresh alongside the buildtools pins.
services = [
    "dreamteam-service-auth @ git+https://github.com/dreamteam-ai-labs/dreamteam-service-auth.git@d9606b5348d7f9178ff05ffda10651390926a225",
]

# Required for the SHA-pinned git+https deps in [buildtools] above. Hatchling
# validates EVERY optional-dependency group during metadata prep — not just the
# extras being installed — so without this flag a direct reference in ANY group
# fails the BARE `pip install -e .`: no metadata, no fastapi, no backend
# (measured 2026-08-12, first editable install after d1156f0 added the pins;
# the production template has carried this same flag at pyproject.toml.mustache:115
# since the extras pattern shipped — the fixture copy just missed it).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fixture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
